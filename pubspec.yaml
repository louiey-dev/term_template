name: term_template
description: "A compact, copyable Flutter template for UART and terminal applications."
publish_to: 'none'

version: 0.1.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.3
  flutter_libserialport: ^0.6.0
  flutter_pty: ^0.4.2
  multi_split_view: ^3.6.2
  xterm:
    path: ../xterm.dart
  hive_ce: ^2.19.3
  path_provider: ^2.1.5
  window_manager: ^0.5.1
  package_info_plus: ^8.3.0
  file_picker: ^11.0.2
  path: ^1.9.1
  logger: ^2.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
